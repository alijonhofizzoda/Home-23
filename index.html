<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./src/output.css" rel="stylesheet">
</head>
<body>
    <header class="w-full bg-white border-b border-gray-100 py-4 px-6">
        <div class="max-w-[1400px] mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 cursor-pointer">
                <div class="w-[260px] h-[24.84px] flex items-center justify-center">
                <img src="./images/logo.svg" alt="logo">
                </div>
            </div>
            
            <div class="text-xs text-gray-400 border-l border-gray-200 pl-4">
                Аналитика и оцифровка продаж<br />
                <span class="text-[#702A8A] font-semibold">Wildberries</span> и <span class="text-[#1065FF] font-semibold">Ozon</span>
            </div>
            </div>

            <nav class="flex items-center gap-8 text-sm font-medium text-gray-700">
            <span class="hover:text-black transition-colors cursor-pointer">О нас</span>
            <span class="hover:text-black transition-colors cursor-pointer">Возможности</span>
            <span class="hover:text-black transition-colors cursor-pointer">Тарифы</span>
            </nav>

            <div class="flex items-center gap-5">
            <div class="flex items-center gap-2 text-sm font-bold text-gray-800 hover:text-black transition-colors cursor-pointer">
                <div class="w-[14px] h-[13px] flex items-center justify-center">
                <img src="./images/vxod.svg" alt="vxod">
                </div>
                Вход
            </div>
            
            <button class="bg-gradient-to-r from-[#00A896] to-[#0081A7] hover:opacity-90 text-white text-sm font-medium px-6 py-2.5 rounded-full transition duration-150">
                Зарегистрироваться
            </button>
            </div>

        </div>
    </header>
</body>
</html>
